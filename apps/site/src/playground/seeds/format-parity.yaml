# yaml-language-server: $schema=../../../../../packages/domain-core/schema/infoschematic.schema.json
id: FORMAT-PARITY
title: Format parity
subtitle: One model, portable data
diagram:
  bounds: 0 0 800 500
  appearance:
    surface: blueprint
    grid: major
    card: { compact: true, identity: true }
  collections:
    - id: CORE
      label: Core
      description: The core collection.
      appearance: { color: '#1f6feb', fill: '#0d1117' }
  families:
    - id: DATA
      label: Data
      description: Data movement.
      color: '#3fb950'
  cards:
    - id: SRC
      label: Source
      description: Emits records.
      collection: CORE
      stereotype: service
      bounds: 100 160 200 120
      ports: 0 1 0 1
    - id: SNK
      label: Sink
      description: Stores records.
      collection: CORE
      stereotype: store
      bounds: 500 160 200 120
      ports: 0 1 0 1
  regions:
    - id: BAND
      label: Band
      bounds: 40 40 720 400
      appearance:
        cornerRadius: 8
        frame: { style: dashed, opacity: 0.6 }
        label: { placement: north-west, mount: boundary }
  flows:
    - id: LOAD
      family: DATA
      link: SRC E1 -> SNK W1
themes:
  - id: OVERVIEW
    label: Overview
    scenes:
      - id: ALL
        label: Everything
        description: Everything at once.
        focus: { elements: [LOAD, SNK, SRC] }
