        fill: "#e4f7ef"
    - id: publication
      label: Publication
      description: Authored and rendered outlets for sharing Infoschematics.
      appearance:
        color: "#a23b72"
        fill: "#fdebf5"
  families:
    - id: dependency
      label: Depends on
      description: A package or host consumes a lower-level package.
      color: "#52606d"
  cards:
