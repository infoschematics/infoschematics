  dynamics:
    - id: contract-change-travels
      label: A contract change travels upward
      description: The Domain Model changed, and each package above it takes the change in one direction only.
      kind: signal-flow
      flows:
        - DEP-001
        - DEP-003
    - id: host-is-the-outlet
      label: The public host is the outlet in view
      description: Publication is what this part of the story is about, so the host stays lit while it is.
      kind: emphasise-elements
      elements:
        - HOST-SITE
      depicts: state
