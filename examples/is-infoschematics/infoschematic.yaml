scopes:
  - id: domain-contract
    label: Domain contract
    description: Dependency-free authored product types.
    elements:
      - PKG-DM
  - id: neutral-behaviour
    label: Framework-neutral behaviour
    description: Framework-neutral domain and visual calculations.
    elements:
      - PKG-DC
      - PKG-VM
  - id: interactive-views
    label: Interactive Views
    description: Additive interactive Views.
    elements:
      - PKG-VC
      - PKG-VP
      - PKG-VS
  - id: renderer-output
    label: Renderer output
    description: Framework-neutral rendering output.
    elements:
      - PKG-SVG
  - id: authored-examples
    label: Authored examples
    description: Independently authored Infoschematic definitions.
    elements:
      - EX-IS
  - id: application-hosts
    label: Application hosts
    description: Deployable composition and publication hosts.
    elements:
      - HOST-SITE
sequences:
  - id: STORY-01
    label: From contract to Audience
    description: How does one authored Infoschematic reach its Audience?
    presentation:
      display: collapsed
      timed: true
      callouts: true
    scenes:
      - id: story-scene-foundations
        label: Define the product
        description: The dependency-free contract supports two independent framework-neutral behaviour packages.
        focus:
          elements:
            - PKG-DM
            - PKG-DC
            - PKG-VM
            - DEP-001
            - DEP-002
        callout:
          body: Begin with serialisable product data and a dependency-free contract.
          takeaways:
            - The Domain Model imports no package.
          placement:
            element: PKG-DM
        cues:
          - dynamic: contract-change-travels
            playback: repeat
        duration: 5
      - id: story-scene-views
        label: Choose the narrowest View
        description: Canvas, Present, and Studio add interactive capability in one direction while retaining the lower-level contracts.
        focus:
          elements:
            - PKG-DM
            - PKG-VM
            - PKG-VC
            - PKG-VP
            - PKG-VS
            - DEP-003
            - DEP-004
            - DEP-005
            - DEP-006
            - DEP-007
            - DEP-009
            - DEP-010
            - DEP-011
            - DEP-012
        callout:
          body: Add Canvas, Present, and Studio capability without moving authored state into a View.
          takeaways:
            - Views depend downward; authored products do not depend on Views.
          placement:
            element: PKG-VS
        duration: 6
      - id: story-scene-outlets
        label: Publish through a host
        description: Static rendering stays framework-neutral, authored examples contain only product data, and the Site owns publication.
        focus:
          elements:
            - PKG-DC
            - PKG-DM
            - PKG-VM
            - PKG-VS
            - PKG-SVG
            - EX-IS
            - HOST-SITE
            - DEP-013
            - DEP-014
            - DEP-015
            - DEP-016
            - DEP-017
        callout:
          body: Let examples own reusable data and let the Site own routing, metadata, and deployment.
          takeaways:
            - The same definition can drive Studio and deterministic SVG.
          placement:
            element: HOST-SITE
        cues:
          - dynamic: host-is-the-outlet
        duration: 6
  - id: OVERVIEW
    label: Overview
    presentation:
      display: expanded
      timed: false
      callouts: false
    scenes:
      - id: SCN-01
        label: Start with the foundations
        description: The dependency-free contract supports two independent framework-neutral behaviour packages.
        focus:
          elements:
            - PKG-DM
            - PKG-DC
            - PKG-VM
            - DEP-001
            - DEP-002
      - id: SCN-02
        label: Add interactive Views
        description: Canvas, Present, and Studio add interactive capability in one direction while retaining the lower-level contracts.
        focus:
          elements:
            - PKG-DM
            - PKG-VM
            - PKG-VC
            - PKG-VP
            - PKG-VS
            - DEP-003
            - DEP-004
            - DEP-005
            - DEP-006
            - DEP-007
            - DEP-009
            - DEP-010
            - DEP-011
            - DEP-012
      - id: SCN-03
        label: Compose examples and hosts
        description: Static rendering stays framework-neutral, authored examples contain only product data, and the Site owns publication.
        focus:
          elements:
            - PKG-DC
            - PKG-DM
            - PKG-VM
            - PKG-VS
            - PKG-SVG
            - EX-IS
            - HOST-SITE
            - DEP-013
            - DEP-014
            - DEP-015
            - DEP-016
            - DEP-017
      - id: SCN-04
