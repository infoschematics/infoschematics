# yaml-language-server: $schema=https://infoschematics.info/schema/infoschematic.schema.json
id: infoschematic-overview
title: What makes an Infoschematic
subtitle: Structure and presentation, rendered or presented
description: Structure and presentation material combine in one Infoschematic, which can be rendered as static output or presented as a live, interactive view.
diagram:
  bounds: 0 0 1268 408
  appearance:
    style: blueprint
    grid: major-plus-minor
    card:
      description: true
      stereotype: true
      compact: false
      identity: true
  collections:
    - id: structure
      label: Structure
      appearance:
        color: "#9673a6"
        fill: "#0d1b2a"
    - id: presentation
      label: Presentation
      appearance:
        color: "#6c8ebf"
        fill: "#0d1b2a"
    - id: product
      label: Product
      appearance:
        color: "#79c9ff"
        fill: "#10283d"
    - id: rendered
      label: Rendered
      appearance:
        color: "#b85450"
        fill: "#0d1b2a"
    - id: presented
      label: Presented
      appearance:
        color: "#82b366"
        fill: "#0d1b2a"
  families:
    - id: composition
      label: Composes
      description: Authored material combines into the product
      color: "#79c9ff"
    - id: output
      label: Produces
      description: One product definition supports multiple outlets
      color: "#82b366"
  cards:
    - id: STR-01
      label: Structure
      description: Diagram, scopes, specifications
      collection: structure
      stereotype: Input
      bounds: 64 64 240 120
      ports:
        east: 1
    - id: PRS-02
      label: Presentation
      description: Scenes and sequences
      collection: presentation
      stereotype: Input
      bounds: 64 224 240 120
      ports:
        east: 1
    - id: INFO-03
      label: Infoschematic
      description: One serialisable product definition
      collection: product
      stereotype: Product
      bounds: 514 144 240 120
      ports:
        east: 2
        west: 2
    - id: OUT-04
      label: Rendered
      description: SVG, images and documents
      collection: rendered
      stereotype: Static output
      bounds: 964 64 240 120
      ports:
        west: 1
    - id: OUT-05
      label: Presented
      description: Interactive, explorable view
      collection: presented
      stereotype: Live output
      bounds: 964 224 240 120
      ports:
        west: 1
  regions:
    - id: inputs
      label: Inputs
      bounds: 24 24 320 360
      appearance:
        label:
          placement: north-west
          mount: boundary
        cornerRadius: 12
        frame:
          style: solid
        fill: "#12273b24"
    - id: product
      label: Product
      bounds: 474 104 320 200
      appearance:
        label:
          placement: north-west
          mount: boundary
        cornerRadius: 12
        frame:
          style: solid
        fill: "#16345136"
    - id: outputs
      label: Outputs
      bounds: 924 24 320 360
      appearance:
        label:
          placement: north-west
          mount: boundary
        cornerRadius: 12
        frame:
          style: solid
        fill: "#12273b24"
  flows:
    - id: SHAPE
      family: composition
      link: STR-01 E1 -> INFO-03 W1
      labelAt: 0.5
      waypoints: 409,124 409,184
    - id: DIRECT
      family: composition
      link: PRS-02 E1 -> INFO-03 W2
      labelAt: 0.5
      waypoints: 409,284 409,224
    - id: RENDER
      family: output
      link: INFO-03 E1 -> OUT-04 W1
      labelAt: 0.5
      waypoints: 859,184 859,124
    - id: PRESENT
      family: output
      link: INFO-03 E2 -> OUT-05 W1
      labelAt: 0.5
      waypoints: 859,224 859,284
  gridSize: 10
scopes:
  - id: product
    label: Product
    description: The complete product from authored inputs to audience-facing outputs
    elements:
      - STR-01
      - PRS-02
      - INFO-03
      - OUT-04
      - OUT-05
      - SHAPE
      - DIRECT
      - RENDER
      - PRESENT
