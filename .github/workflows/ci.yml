name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Install the toolchain from mise.toml (pins node + bun); no version is
      # hardcoded here — mise.toml is the single source of truth.
      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The dependency-boundary checker has its own install root outside the workspace graph, so the root install
      # does not reach it; the audit and Site's boundary suite both drive its binary.
      - name: Install boundary checker
        run: bun install --frozen-lockfile --cwd tooling/boundaries

      # Turborepo replays any task whose declared inputs are unchanged, so a run that touches
      # one package pays for that package rather than for the whole gate.
      - name: Restore task cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install browser-test runtime
        run: bunx playwright install --with-deps chromium

      - name: Install and verify released KI
        env:
          KI_VERSION: v0.7.1
          KI_ROOT: ${{ runner.temp }}/ki-fnd-001
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          export KI_CLI_INSTALL_DIR="$KI_ROOT/bin"
          export KI_MAN_INSTALL_DIR="$KI_ROOT/share/man/man1"
          export XDG_DATA_HOME="$KI_ROOT/data"
          export XDG_CONFIG_HOME="$KI_ROOT/config"
          export XDG_CACHE_HOME="$KI_ROOT/cache"
          export XDG_STATE_HOME="$KI_ROOT/state"
          mkdir -p "$KI_ROOT"
          mkdir -p "$XDG_CONFIG_HOME/ki"
          printf 'mcpServers: []\n' > "$XDG_CONFIG_HOME/ki/mcp-servers.yaml"
          curl --fail -sSL --proto '=https' -o "$RUNNER_TEMP/install.sh" "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${KI_VERSION#v}"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          project_key=${GITHUB_WORKSPACE//\//-}
          mkdir -p "$HOME/.claude/projects/$project_key/memory"
          touch "$HOME/.claude/projects/$project_key/memory/MEMORY.md"
          ki diag | tee "$KI_ROOT/ki-diag.txt"
          grep -F "Configuration: valid" "$KI_ROOT/ki-diag.txt"
          grep -F "Registry: valid" "$KI_ROOT/ki-diag.txt"
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            echo "KI_CLI_INSTALL_DIR=$KI_CLI_INSTALL_DIR"
            echo "KI_MAN_INSTALL_DIR=$KI_MAN_INSTALL_DIR"
            echo "XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
            echo "XDG_STATE_HOME=$XDG_STATE_HOME"
          } >> "$GITHUB_ENV"
          echo "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"

      # The native read-only gate resolves the repository's declared skills from the
      # verified active harness collection and runs their registered operations.
      - name: Build workspace prerequisites
        run: bun run self:packages:build

      - name: Link built workspace CLI
        run: bun install --frozen-lockfile

      - name: Audit
        run: ki repo audit --repo .

      - name: Test
        run: bun run test

      - name: Full local verification gate
        run: bun run self:check

      - name: Build and verify packed release packages
        run: bun run self:release:verify
