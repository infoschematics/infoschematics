# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/infoschematics/infoschematics"
title = "Infoschematics"
description = "The Infoschematic domain model, framework-neutral view model, interactive views, authored examples, guidance, and public website."
repo_code = "INFOSCHEMATICS"
supported_runtimes = ["claude-code", "chatgpt-codex"]
visibility = "public"
license = "MIT"

[skills.ki-repo.checks]
# The standard topic set (mcp, model-context-protocol, claude) describes MCP servers,
# not this diagramming product; accurate topics are set directly on GitHub instead.
topics = false
# The KI engineering toolchain (Biome, knip, syncpack, compiled root build) conflicts
# with the delivered per-package release build; adopt it through a roadmap item first.
coverage-engineering = false

[skills.ki-repo-project]

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-authoring]

[skills.ki-git]

[skills.ki-agora]

[skills.ki-agora.memberships.hnr]

home = "https://github.com/krisb/kit-hnr"
role = "maintainer"

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]

[skills.ki-work-roadmap.areas]
SITE = "site-experience"
TOOL = "tool"

[skills.ki-repo-website]
site-root = "apps/site"

