# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/infoschematics/infoschematics"
title = "Infoschematics"
description = "The Infoschematic domain model, framework-neutral view model, interactive views, authored examples, guidance, and public website."
repo_code = "INFOSCHEMATICS"
visibility = "public"
license = "MIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]

[skills.ki-authoring]
[skills.ki-binding]
[skills.ki-binding-claude]
[skills.ki-binding-chatgpt]
[skills.ki-housekeeping-chatgpt]
auto_memory = "disabled"

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-website]

[skills.ki-repo-website-app]

[skills.ki-repo-website-cloudflare]

# -----------------------------------------------------------------------------
# Governance runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]
# `test:browser` is a bare name the standard's six lifecycle idioms do not include. GDR-INFOSCHEMATICS-005 keeps it:
# four workspaces declare the task, and a root script that did not match the task name would stop being a passthrough.
script_exclusions = ["test:browser"]
# Each hold is a deliberate deferral of a major release pending its own verified migration.
dependency_holds = [
  "@types/node — major releases (24, 26); the definitions track the oldest Node the packages promise in engines, per GDR-INFOSCHEMATICS-004, so this lifts when that floor does",
]
# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-agent-coordination-paperclip]
organisation_code = "HNR"

[skills.ki-git]

[skills.ki-housekeeping-claude]
auto_memory = "transition"

[skills.ki-tokenomics]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-chatgpt]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
areas.SITE = "site-experience"
areas.TOOL = "tool"

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-agora]
memberships.hnr = { home = "https://github.com/krisb/kit-hnr", role = "member" }

[skills.ki-specs]

[skills.ki-decision-records]

[skills.ki-guides]
